[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "metals-evidence-engine"
version = "0.1.0"
description = "Point-in-time evidence evaluation for explicit physical-metals hypotheses."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]

[project.scripts]
metals-evidence = "metals_evidence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metals_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["metals_evidence"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
